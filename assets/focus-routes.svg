<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Three engineering focus routes</title>
  <desc id="desc">AI and Data Engineering, Game Development, and Computer Engineering represented as three connected system routes.</desc>
  <rect width="900" height="470" fill="#080808"/>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}
    .line{stroke:#2A2A28;fill:none}.paper{fill:#F1EFE8}.soft{fill:#92928C}.accent{fill:#FF5A36}
    .micro{font-size:11px;letter-spacing:1.5px}.body{font-size:13px}.route{font-size:17px;font-weight:700;letter-spacing:.2px}
  </style>
  <path class="line" d="M30 27H870M30 442H870"/>
  <text class="mono accent micro" x="34" y="56">ACTIVE DISCIPLINES / 03</text>
  <text class="sans paper" x="34" y="95" font-size="29" font-weight="700" letter-spacing="-.6">THREE ROUTES. ONE ENGINEERING MINDSET.</text>
  <text class="mono soft body" x="34" y="121">THE WORK CHANGES FORM; THE HABIT STAYS THE SAME — MODEL, BUILD, TEST, ITERATE.</text>

  <g transform="translate(34 155)">
    <rect width="262" height="245" class="line"/>
    <text class="mono accent micro" x="18" y="30">ROUTE / 01</text>
    <text class="mono paper route" x="18" y="61"><![CDATA[AI & DATA ENGINEERING]]></text>
    <text class="mono soft body" x="18" y="88">FROM RAW SIGNAL</text><text class="mono soft body" x="18" y="106">TO USEFUL SYSTEM.</text>
    <g transform="translate(18 135)">
      <ellipse cx="37" cy="7" rx="37" ry="7" fill="#2A2A28"/><path d="M0 7V39c0 4 17 8 37 8s37-4 37-8V7" fill="none" stroke="#92928C"/>
      <ellipse cx="37" cy="23" rx="37" ry="7" fill="none" stroke="#92928C"/><ellipse cx="37" cy="39" rx="37" ry="7" fill="none" stroke="#92928C"/>
      <path d="M82 23H112M112 23l-7-6m7 6-7 6" class="line"/>
      <g transform="translate(124 0)"><circle cx="21" cy="23" r="18" fill="none" stroke="#FF5A36"/><circle cx="21" cy="23" r="4" class="accent"/>
        <path d="M21 5V-7M37 14l11-6M37 32l11 7M5 14l-11-6M5 32l-11 7" stroke="#92928C" fill="none"/>
      </g>
    </g>
    <text class="mono soft micro" x="18" y="227">DATA · MODELS · PIPELINES</text>
  </g>

  <g transform="translate(319 155)">
    <rect width="262" height="245" class="line"/>
    <text class="mono accent micro" x="18" y="30">ROUTE / 02</text>
    <text class="mono paper route" x="18" y="61">GAME DEVELOPMENT</text>
    <text class="mono soft body" x="18" y="88">SYSTEMS THAT BECOME</text><text class="mono soft body" x="18" y="106">PLAYER EXPERIENCE.</text>
    <g transform="translate(24 133)">
      <path d="M0 40L54 8l54 32-54 32z" fill="none" stroke="#2A2A28"/>
      <path d="M54 8v64M0 40l54 16 54-16" class="line"/>
      <circle cx="54" cy="8" r="6" class="accent"/><circle cx="0" cy="40" r="4" fill="#92928C"/><circle cx="108" cy="40" r="4" fill="#92928C"/>
      <path d="M139 21h46c11 0 20 9 20 20v7c0 9-7 16-16 16h-4l-10-12h-26l-10 12h-4c-9 0-16-7-16-16v-7c0-11 9-20 20-20z" fill="none" stroke="#92928C"/>
      <path d="M139 42h18M148 33v18" stroke="#F1EFE8"/><circle cx="184" cy="38" r="3" class="accent"/><circle cx="194" cy="47" r="3" fill="#F1EFE8"/>
    </g>
    <text class="mono soft micro" x="18" y="227">GAMEPLAY · TOOLS · WORLDS</text>
  </g>

  <g transform="translate(604 155)">
    <rect width="262" height="245" class="line"/>
    <text class="mono accent micro" x="18" y="30">ROUTE / 03</text>
    <text class="mono paper route" x="18" y="61">COMPUTER ENGINEERING</text>
    <text class="mono soft body" x="18" y="88">THE FOUNDATION UNDER</text><text class="mono soft body" x="18" y="106">EVERY ABSTRACTION.</text>
    <g transform="translate(36 129)">
      <rect x="34" y="3" width="78" height="78" rx="3" fill="none" stroke="#92928C"/>
      <rect x="50" y="19" width="46" height="46" fill="#2A2A28"/><circle cx="73" cy="42" r="8" class="accent"/>
      <g stroke="#92928C"><path d="M20 16h14M20 29h14M20 42h14M20 55h14M20 68h14M112 16h14M112 29h14M112 42h14M112 55h14M112 68h14"/>
      <path d="M47 3v-14M60 3v-14M73 3v-14M86 3v-14M99 3v-14M47 81v14M60 81v14M73 81v14M86 81v14M99 81v14"/></g>
      <path d="M147 42h42" class="line"/><circle cx="189" cy="42" r="7" fill="#F1EFE8"/>
    </g>
    <text class="mono soft micro" x="18" y="227">ALGORITHMS · SYSTEMS · CORE</text>
  </g>

  <g class="mono soft micro"><text x="34" y="430">ROUTES SHARE TOOLS, CONSTRAINTS, AND CURIOSITY.</text><text x="866" y="430" text-anchor="end">BUILD MAP / STABLE</text></g>
</svg>
